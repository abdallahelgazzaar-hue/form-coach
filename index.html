<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>Form Coach</title>
<style>
  :root {
    --bg: #0f1720; --panel: #17212c; --panel-2: #1f2b38; --text: #eef2f6; --muted: #93a1b0;
    --good: #2fbf71; --warn: #f2b134; --bad: #ef5350; --accent: #4ea1ff; --line: #2a3746;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .screen { display: none; min-height: 100%; }
  .screen.active { display: flex; flex-direction: column; }

  /* Start screen */
  #start { padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; gap: 18px; }
  h1 { font-size: 26px; margin: 8px 0 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0; line-height: 1.45; }
  .ex-grid { display: grid; gap: 10px; }
  .ex { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: var(--panel);
    border: 2px solid transparent; text-align: left; }
  .ex[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-2); }
  .ex .icon { width: 44px; height: 44px; border-radius: 12px; background: #24364a; display: grid; place-items: center; flex: none; }
  .ex b { display: block; font-size: 17px; }
  .ex span { color: var(--muted); font-size: 14px; }
  .setup { background: var(--panel); border-radius: 14px; padding: 14px 16px; font-size: 14px; line-height: 1.5; color: var(--muted); }
  .setup b { color: var(--text); }
  .setup ol { margin: 6px 0 0; padding-left: 20px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .toggle { flex: 1; min-width: 140px; padding: 12px; border-radius: 12px; background: var(--panel); font-size: 14px; }
  .toggle[aria-pressed="true"] { background: var(--panel-2); outline: 2px solid var(--accent); }
  .primary { padding: 16px; border-radius: 14px; background: var(--accent); color: #06121f; font-weight: 700; font-size: 17px; }
  .primary:disabled { opacity: .55; }
  .privacy { font-size: 12.5px; color: var(--muted); text-align: center; margin: 0; }
  #status { font-size: 14px; color: var(--warn); text-align: center; min-height: 1.2em; margin: 0; }

  /* Live screen */
  #live { position: fixed; inset: 0; background: #000; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #stage.mirror video, #stage.mirror canvas { transform: scaleX(-1); }
  video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
    display: flex; gap: 8px; align-items: stretch; background: linear-gradient(#000a, #0000); }
  .stat { background: #0f1720cc; border-radius: 12px; padding: 8px 12px; min-width: 76px; backdrop-filter: blur(6px); }
  .stat small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .stat strong { font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat.grow { flex: 1; }
  #scoreBar { height: 6px; background: #ffffff22; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  #scoreBar i { display: block; height: 100%; width: 0; background: var(--good); transition: width .2s, background .2s; }
  .icon-btn { width: 44px; border-radius: 12px; background: #0f1720cc; display: grid; place-items: center; flex: none; }
  .checks { position: absolute; left: 12px; top: calc(96px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 6px; }
  .chip { display: flex; align-items: center; gap: 8px; background: #0f1720cc; border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 13px; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--good); }
  .chip[data-s="warn"] i { background: var(--warn); } .chip[data-s="bad"] i { background: var(--bad); }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 12px calc(14px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px; background: linear-gradient(#0000, #000c); }
  #cue { min-height: 52px; border-radius: 14px; padding: 12px 14px; background: #0f1720e6; font-size: 17px; font-weight: 600;
    display: flex; align-items: center; border-left: 5px solid var(--muted); }
  #cue[data-s="good"] { border-color: var(--good); } #cue[data-s="warn"] { border-color: var(--warn); } #cue[data-s="bad"] { border-color: var(--bad); }
  #repToast { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.9); opacity: 0;
    padding: 14px 22px; border-radius: 16px; font-size: 22px; font-weight: 800; transition: opacity .2s, transform .2s; pointer-events: none; text-align: center; }
  #repToast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #repToast small { display: block; font-size: 13px; font-weight: 600; opacity: .9; }
  .stop { padding: 14px; border-radius: 14px; background: #ffffff1f; font-weight: 700; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; background: #000c; font-size: 15px; color: var(--muted); text-align: center; padding: 16px; }

  /* Summary */
  #summary { padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; gap: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .kpi { background: var(--panel); border-radius: 14px; padding: 14px 12px; }
  .kpi small { color: var(--muted); font-size: 12px; }
  .kpi strong { display: block; font-size: 26px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card { background: var(--panel); border-radius: 14px; padding: 14px 16px; }
  .card h3 { margin: 0 0 8px; font-size: 15px; }
  .card ul { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.6; font-size: 14px; }
  .reps { display: flex; flex-wrap: wrap; gap: 6px; }
  #summary .toggle { flex: none; }
  .rep { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #06121f; }
</style>
</head>
<body>

<section id="start" class="screen active">
  <div>
    <h1>Form Coach</h1>
    <p class="sub">Real-time exercise form checks using your phone camera.</p>
  </div>

  <div class="ex-grid" role="group" aria-label="Exercise">
    <button class="ex" data-ex="squat" aria-pressed="true">
      <div class="icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9cc9ff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="4" r="2"/><path d="M12 6v6l-4 3 3 5M12 12l5 1"/></svg></div>
      <div><b>Squat</b><span>Depth, chest position, rep count</span></div>
    </button>
    <button class="ex" data-ex="pushup" aria-pressed="false">
      <div class="icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9cc9ff" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="9" r="2"/><path d="M7 10l14 4M8 11v6M3 17h18"/></svg></div>
      <div><b>Push-up</b><span>Elbow depth, hip sag or pike, rep count</span></div>
    </button>
    <button class="ex" data-ex="plank" aria-pressed="false">
      <div class="icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9cc9ff" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="10" r="2"/><path d="M7 11l14 3M7 12v5h3M3 17h18"/></svg></div>
      <div><b>Plank</b><span>Body line, timer that pauses on bad form</span></div>
    </button>
  </div>

  <div class="setup" id="setupTips"></div>

  <div class="row">
    <button class="toggle" id="camToggle" aria-pressed="false">Camera: <b id="camLabel">Front</b></button>
    <button class="toggle" id="voiceToggle" aria-pressed="true">Voice cues: <b id="voiceLabel">On</b></button>
  </div>

  <button class="primary" id="startBtn">Start camera</button>
  <p id="status" role="status"></p>
  <p class="privacy">Video is analysed on this device and is never uploaded or recorded.</p>
</section>

<section id="live" class="screen">
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="hud">
    <div class="stat"><small id="countLabel">Reps</small><strong id="count">0</strong></div>
    <div class="stat grow"><small>Form score</small><strong id="score">--</strong><div id="scoreBar"><i></i></div></div>
    <button class="icon-btn" id="flipBtn" aria-label="Switch camera">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 7h11l-3-3M20 17H9l3 3"/></svg>
    </button>
  </div>
  <div class="checks" id="checks"></div>
  <div id="repToast"></div>
  <div class="bottom">
    <div id="cue" data-s="">Getting ready…</div>
    <button class="stop" id="stopBtn">Finish set</button>
  </div>
  <div id="loading">Loading pose model…</div>
</section>

<section id="summary" class="screen">
  <h1 id="sumTitle">Set summary</h1>
  <div class="kpis" id="kpis"></div>
  <div class="card"><h3>Reps</h3><div class="reps" id="repChips"></div></div>
  <div class="card"><h3>What to work on</h3><ul id="faults"></ul></div>
  <button class="primary" id="againBtn">Start another set</button>
  <button class="toggle" id="homeBtn">Change exercise</button>
</section>

<script type="module">
import { Analyzer } from './engine.js';

// Library, WASM runtime and model are served next to this page so nothing depends on a third-party CDN at runtime.
const VENDOR = './vendor/';
const MODEL = VENDOR + 'pose_landmarker_lite.task';
// Hosts that refuse binary model files get a base64 text copy instead.
const MODEL_B64 = VENDOR + 'pose_landmarker_lite.task.b64.txt';

async function loadModelBytes() {
  try {
    const r = await fetch(MODEL);
    if (r.ok) return new Uint8Array(await r.arrayBuffer());
  } catch (e) { /* fall through */ }
  const r = await fetch(MODEL_B64);
  if (!r.ok) throw new Error('Pose model could not be downloaded (' + r.status + ')');
  const bin = atob((await r.text()).trim());
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

const TIPS = {
  squat: '<b>Setup</b><ol><li>Prop the phone at hip height, 2 to 3 m away.</li><li>Stand <b>side-on</b> to the camera, feet hip to shoulder width.</li><li>Make sure head to feet are in frame.</li></ol>',
  pushup: '<b>Setup</b><ol><li>Place the phone on the floor, 2 m away, side-on to you.</li><li>Your whole body, hands to feet, must be in frame.</li><li>Start at the top with arms straight.</li></ol>',
  plank: '<b>Setup</b><ol><li>Place the phone on the floor, 2 m away, side-on to you.</li><li>Shoulders, hips and ankles must be in frame.</li><li>The timer only runs while your body line is acceptable.</li></ol>',
};
const NAMES = { squat: 'Squat', pushup: 'Push-up', plank: 'Plank' };

const $ = (id) => document.getElementById(id);
const state = { exercise: 'squat', facing: 'user', voice: true, landmarker: null, stream: null, analyzer: null,
  running: false, lastVideoTime: -1, lastCueAt: 0, lastSpoken: '', raf: 0 };

function show(id) { for (const s of document.querySelectorAll('.screen')) s.classList.toggle('active', s.id === id); }

// ----- Start screen controls -----
for (const b of document.querySelectorAll('.ex')) {
  b.addEventListener('click', () => {
    state.exercise = b.dataset.ex;
    for (const o of document.querySelectorAll('.ex')) o.setAttribute('aria-pressed', String(o === b));
    $('setupTips').innerHTML = TIPS[state.exercise];
    // Floor exercises are easier with the rear camera; squats with the front one so you can see yourself.
    setFacing(state.exercise === 'squat' ? 'user' : state.facing);
  });
}
$('setupTips').innerHTML = TIPS.squat;
function setFacing(f) {
  state.facing = f;
  $('camLabel').textContent = f === 'user' ? 'Front' : 'Rear';
  $('camToggle').setAttribute('aria-pressed', String(f === 'environment'));
}
$('camToggle').addEventListener('click', () => setFacing(state.facing === 'user' ? 'environment' : 'user'));
$('voiceToggle').addEventListener('click', () => {
  state.voice = !state.voice;
  $('voiceLabel').textContent = state.voice ? 'On' : 'Off';
  $('voiceToggle').setAttribute('aria-pressed', String(state.voice));
});
$('startBtn').addEventListener('click', startSession);
$('stopBtn').addEventListener('click', finishSession);
$('againBtn').addEventListener('click', startSession);
$('homeBtn').addEventListener('click', () => show('start'));
$('flipBtn').addEventListener('click', async () => { setFacing(state.facing === 'user' ? 'environment' : 'user'); await openCamera(); });

// ----- Model -----
async function loadModel() {
  if (state.landmarker) return state.landmarker;
  const { PoseLandmarker } = await import(VENDOR + 'vision_bundle.mjs');
  const fileset = { wasmLoaderPath: VENDOR + 'vision_wasm_internal.js', wasmBinaryPath: VENDOR + 'vision_wasm_internal.wasm' };
  const modelBytes = await loadModelBytes();
  const opts = (delegate) => ({
    baseOptions: { modelAssetBuffer: modelBytes, delegate },
    runningMode: 'VIDEO', numPoses: 1,
    minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5,
  });
  try { state.landmarker = await PoseLandmarker.createFromOptions(fileset, opts('GPU')); state.delegate = 'GPU'; }
  catch (e) { console.warn('GPU delegate failed, using CPU', e); state.landmarker = await PoseLandmarker.createFromOptions(fileset, opts('CPU')); state.delegate = 'CPU'; }
  return state.landmarker;
}

// ----- Camera -----
async function openCamera() {
  if (state.stream) for (const t of state.stream.getTracks()) t.stop();
  const video = $('video');
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({
      audio: false, video: { facingMode: state.facing, width: { ideal: 1280 }, height: { ideal: 720 } },
    });
  } catch (e) {
    if (e?.name === 'NotAllowedError') throw e;
    // Some devices (laptops, older phones) reject the constraints: fall back to any camera.
    console.warn('Camera constraints rejected, retrying with defaults', e);
    state.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
  }
  video.srcObject = state.stream;
  await video.play();
  $('stage').classList.toggle('mirror', state.facing === 'user');
  state.lastVideoTime = -1;
}

async function startSession() {
  $('status').textContent = '';
  if (!navigator.mediaDevices?.getUserMedia) {
    $('status').textContent = 'This browser cannot open the camera. Use Safari or Chrome over https.'; return;
  }
  $('startBtn').disabled = true;
  show('live');
  $('loading').style.display = 'grid';
  $('loading').textContent = 'Loading pose model…';
  state.analyzer = new Analyzer(state.exercise);
  $('countLabel').textContent = state.exercise === 'plank' ? 'Hold' : 'Reps';
  $('count').textContent = state.exercise === 'plank' ? '0:00' : '0';
  $('score').textContent = '--';
  $('checks').innerHTML = '';
  try {
    await Promise.all([loadModel(), openCamera()]);
  } catch (e) {
    console.error(e);
    show('start');
    $('startBtn').disabled = false;
    const embeddedBlock = window.self !== window.top && document.featurePolicy?.allowsFeature?.('camera') === false;
    $('status').textContent = embeddedBlock
      ? 'This page is shown inside a viewer that blocks the camera. Open the app from its own web address instead.'
      : e?.name === 'NotAllowedError'
      ? 'Camera permission was denied. Allow camera access for this site in your browser and try again.'
      : 'Could not start: ' + (e?.message || e);
    return;
  }
  $('loading').style.display = 'none';
  $('startBtn').disabled = false;
  state.running = true;
  setCue(`${NAMES[state.exercise]}: get into position`, '');
  speak(`${NAMES[state.exercise]}. Get into position.`, true);
  loop();
}

function finishSession() {
  state.running = false;
  cancelAnimationFrame(state.raf);
  if (state.stream) for (const t of state.stream.getTracks()) t.stop();
  state.stream = null;
  speechSynthesis?.cancel?.();
  renderSummary(state.analyzer.summary());
  show('summary');
}

// ----- Main loop -----
function loop() {
  if (!state.running) return;
  const video = $('video');
  if (video.readyState >= 2 && video.currentTime !== state.lastVideoTime) {
    state.lastVideoTime = video.currentTime;
    const t = performance.now();
    const res = state.landmarker.detectForVideo(video, t);
    const lms = res.landmarks?.[0] ?? null;
    const out = state.analyzer.update(lms, video.videoWidth, video.videoHeight, t);
    draw(lms, out, video);
    render(out);
  }
  state.raf = requestAnimationFrame(loop);
}

// ----- Drawing -----
const COLORS = { good: '#2fbf71', warn: '#f2b134', bad: '#ef5350', idle: '#ffffffaa' };
const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,31],[28,32]];
const JOINT_OF = { 11:'shoulder',12:'shoulder',13:'elbow',14:'elbow',23:'hip',24:'hip',25:'knee',26:'knee',27:'ankle',28:'ankle' };

function draw(lms, out, video) {
  const c = $('overlay');
  // Match canvas to the displayed (object-fit: cover) video area.
  const rect = c.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (c.width !== Math.round(rect.width * dpr) || c.height !== Math.round(rect.height * dpr)) {
    c.width = Math.round(rect.width * dpr); c.height = Math.round(rect.height * dpr);
  }
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  if (!lms) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(c.width / vw, c.height / vh);
  const ox = (c.width - vw * s) / 2, oy = (c.height - vh * s) / 2;
  const P = (l) => [ox + l.x * vw * s, oy + l.y * vh * s];
  const status = (i) => (out.ready && out.joints?.[JOINT_OF[i]]) || 'idle';
  const activeSide = out.side === 'right' ? 0 : 1; // odd indices = left side in BlazePose
  ctx.lineCap = 'round';
  for (const [a, b] of BONES) {
    if ((lms[a].visibility ?? 1) < 0.4 || (lms[b].visibility ?? 1) < 0.4) continue;
    const onActive = a % 2 === activeSide && b % 2 === activeSide;
    const st = status(a) === 'bad' || status(b) === 'bad' ? 'bad' : status(a) === 'warn' || status(b) === 'warn' ? 'warn' : status(a);
    ctx.strokeStyle = onActive ? COLORS[st] : '#ffffff55';
    ctx.lineWidth = (onActive ? 6 : 3) * dpr;
    const [x1, y1] = P(lms[a]), [x2, y2] = P(lms[b]);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  for (const i of Object.keys(JOINT_OF).map(Number)) {
    if ((lms[i].visibility ?? 1) < 0.4) continue;
    const [x, y] = P(lms[i]);
    ctx.fillStyle = i % 2 === activeSide ? COLORS[status(i)] : '#ffffff88';
    ctx.beginPath(); ctx.arc(x, y, (i % 2 === activeSide ? 7 : 4) * dpr, 0, Math.PI * 2); ctx.fill();
  }
}

// ----- HUD -----
function fmt(ms) { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

function render(out) {
  if (!out.ready) { setCue(out.cue, 'warn'); maybeSpeak(out.cue); $('checks').innerHTML = ''; return; }
  if (state.exercise === 'plank') $('count').textContent = fmt(out.hold.holdMs);
  else $('count').textContent = `${out.validReps}${out.reps !== out.validReps ? `/${out.reps}` : ''}`;
  $('score').textContent = out.frameScore;
  const bar = $('scoreBar').firstElementChild;
  bar.style.width = out.frameScore + '%';
  bar.style.background = out.frameScore >= 85 ? COLORS.good : out.frameScore >= 60 ? COLORS.warn : COLORS.bad;
  $('checks').innerHTML = out.checks.map((c) => `<div class="chip" data-s="${c.status}"><i></i>${c.label} ${Math.round(c.value)}°</div>`).join('');

  if (out.repEvent) {
    const r = out.repEvent;
    toast(r.valid ? `Rep ${r.n} ✓` : `Rep ${r.n} not counted`, r.faults[0] ?? `Score ${r.score}`, r.valid ? 'good' : 'bad');
    const n = String(state.analyzer.validReps);
    speak(r.valid ? (r.faults[0] ? `${n}. ${r.faults[0]}` : n) : `Not counted. ${r.faults[0] ?? ''}`, true);
  }
  const worst = out.checks.find((c) => c.status === 'bad') ?? out.checks.find((c) => c.status === 'warn');
  if (out.cue) { setCue(out.cue, worst?.status ?? 'warn'); maybeSpeak(out.cue); }
  else setCue(state.exercise === 'plank' ? 'Good line. Keep breathing.' : out.phase === 'down' ? 'Good. Drive back up.' : 'Good form. Keep going.', 'good');
}

function setCue(text, s) { const el = $('cue'); if (el.textContent !== text) el.textContent = text; el.dataset.s = s; }

let toastTimer;
function toast(title, sub, s) {
  const el = $('repToast');
  el.innerHTML = `${title}<small>${sub ?? ''}</small>`;
  el.style.background = s === 'good' ? '#2fbf71ee' : '#ef5350ee';
  el.style.color = '#06121f';
  el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1300);
}

function maybeSpeak(text) {
  const now = performance.now();
  if (now - state.lastCueAt < 3500 || text === state.lastSpoken && now - state.lastCueAt < 8000) return;
  speak(text);
}
function speak(text, force = false) {
  if (!state.voice || !('speechSynthesis' in window)) return;
  if (force) speechSynthesis.cancel(); else if (speechSynthesis.speaking) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.05;
  speechSynthesis.speak(u);
  state.lastCueAt = performance.now(); state.lastSpoken = text;
}

// ----- Summary -----
function renderSummary(s) {
  $('sumTitle').textContent = `${NAMES[s.exercise]} summary`;
  const k = s.exercise === 'plank'
    ? [['Good-form hold', fmt(s.holdMs)], ['Time in position', fmt(s.totalMs)], ['Form held', s.totalMs ? Math.round(100 * s.holdMs / s.totalMs) + '%' : '--']]
    : [['Valid reps', s.validReps], ['Attempted', s.reps], ['Avg score', s.avgScore ?? '--']];
  $('kpis').innerHTML = k.map(([l, v]) => `<div class="kpi"><small>${l}</small><strong>${v}</strong></div>`).join('');
  $('repChips').parentElement.style.display = s.exercise === 'plank' ? 'none' : '';
  $('repChips').innerHTML = s.repLog.map((r) => `<div class="rep" title="${r.faults.join(' ') || 'Clean rep'}" style="background:${r.score >= 85 ? COLORS.good : r.score >= 60 ? COLORS.warn : COLORS.bad}">${r.score}</div>`).join('') || '<span class="sub">No reps detected.</span>';
  const f = s.faults.slice(0, 3).map(([name, n]) => s.exercise === 'plank' ? `${name}: ${fmt(n)}` : `${name} (${n}×)`);
  $('faults').innerHTML = (f.length ? f : ['No recurring faults detected.']).map((x) => `<li>${x}</li>`).join('');
}

// Test hook (used by automated checks only).
window.__formCoach = { state, render, renderSummary };
</script>
</body>
